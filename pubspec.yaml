name: stone_deep_tech
description: Flutter plugin for Stone Smart POS via deeplink. Payments (debit, credit, voucher, PIX), cancellation, custom printing and receipt reprint on Android.
version: 2.0.0
homepage: https://github.com/JY-Labtech/stone_deep_tech
repository: https://github.com/JY-Labtech/stone_deep_tech
issue_tracker: https://github.com/JY-Labtech/stone_deep_tech/issues
topics:
  - payment
  - pos
  - android
  - flutter-plugin
  - brazil

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.stone_deep_tech
        pluginClass: StoneDeepTechPlugin
